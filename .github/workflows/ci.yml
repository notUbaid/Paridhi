name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Test, type-check, lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Type-check API and shared code
        run: npm run typecheck

      - name: Lint web app
        run: npm run lint

      - name: Build web app
        run: npm run build
